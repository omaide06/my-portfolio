<!doctype html>
<html lang="en">
  <head>
    <script>
      // Prevent TypeError when extensions or environment scripts attempt to assign to window.fetch in sandboxed contexts
      (function() {
        try {
          const originalFetch = window.fetch;
          let currentFetch = originalFetch;
          Object.defineProperty(window, 'fetch', {
            get: () => currentFetch,
            set: (val) => { currentFetch = val; },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          // Fail gracefully if window.fetch cannot be redefined
        }
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Om Aide — Student Portfolio</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
